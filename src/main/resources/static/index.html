<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Java Web Application | Nalinda</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                radial-gradient(circle at top left, #2563eb 0%, transparent 35%),
                radial-gradient(circle at bottom right, #7c3aed 0%, transparent 35%),
                #0f172a;

            color: white;

            overflow: hidden;
        }


        /* Background circles */

        body::before {

            content: "";

            position: absolute;

            width: 300px;

            height: 300px;

            background: rgba(59, 130, 246, 0.2);

            border-radius: 50%;

            top: -100px;

            right: -80px;

            filter: blur(20px);
        }


        body::after {

            content: "";

            position: absolute;

            width: 250px;

            height: 250px;

            background: rgba(139, 92, 246, 0.2);

            border-radius: 50%;

            bottom: -80px;

            left: -70px;

            filter: blur(20px);
        }


        /* Main container */

        .container {

            position: relative;

            z-index: 2;

            width: 90%;

            max-width: 550px;

            padding: 45px 35px;

            text-align: center;

            border-radius: 25px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.15);

            backdrop-filter: blur(15px);

            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.4);

            animation: cardAppear 0.8s ease;
        }


        /* Status */

        .status {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 8px 15px;

            border-radius: 50px;

            background: rgba(34, 197, 94, 0.15);

            border: 1px solid rgba(34, 197, 94, 0.3);

            color: #86efac;

            font-size: 14px;

            margin-bottom: 25px;
        }


        .status-dot {

            width: 9px;

            height: 9px;

            background: #22c55e;

            border-radius: 50%;

            box-shadow: 0 0 10px #22c55e;

            animation: pulse 1.5s infinite;
        }


        /* Heading */

        h1 {

            font-size: 42px;

            margin-bottom: 15px;

            background: linear-gradient(
                90deg,
                #60a5fa,
                #a78bfa
            );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .subtitle {

            color: #cbd5e1;

            font-size: 17px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* Info cards */

        .info-container {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-bottom: 30px;
        }


        .info-card {

            padding: 15px;

            border-radius: 15px;

            background: rgba(255, 255, 255, 0.06);

            border: 1px solid rgba(255, 255, 255, 0.08);
        }


        .info-card span {

            display: block;

            color: #94a3b8;

            font-size: 12px;

            margin-bottom: 5px;
        }


        .info-card strong {

            font-size: 15px;

            color: #f8fafc;
        }


        /* Button */

        button {

            border: none;

            padding: 15px 35px;

            font-size: 17px;

            font-weight: bold;

            color: white;

            border-radius: 12px;

            cursor: pointer;

            background: linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            box-shadow:
                0 10px 25px rgba(37, 99, 235, 0.35);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        button:hover {

            transform: translateY(-3px);

            box-shadow:
                0 15px 35px rgba(124, 58, 237, 0.5);
        }


        button:active {

            transform: translateY(0);
        }


        /* Message */

        #message {

            min-height: 30px;

            margin-top: 25px;

            font-size: 17px;

            color: #82efac;

            opacity: 0;

            transform: translateY(10px);

            transition: all 0.4s ease;
        }


        #message.show {

            opacity: 1;

            transform: translateY(0);
        }


        /* Footer */

        .footer {

            margin-top: 30px;

            color: #64844b;

            font-size: 13px;
        }


        /* Animations */

        @keyframes cardAppear {

            from {

                opacity: 0;

                transform: translateY(30px);
            }

            to {

                opacity: 1;

                transform: translateY(0);
            }
        }


        @keyframes pulse {

            0% {

                transform: scale(1);

                opacity: 1;
            }

            50% {

                transform: scale(1.4);

                opacity: 0.6;
            }

            100% {

                transform: scale(1);

                opacity: 1;
            }
        }


        /* Mobile */

        @media (max-width: 500px) {

            .container {

                padding: 35px 20px;
            }

            h1 {

                font-size: 32px;
            }

            .subtitle {

                font-size: 15px;
            }

            .info-container {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <div class="container">


        <div class="status">

            <span class="status-dot"></span>

            Application Running

        </div>


        <h1>Java Web Application</h1>


        <p class="subtitle">

            Welcome to my Java web application.

            This page demonstrates a simple interactive

            Java-based web application.

        </p>


        <div class="info-container">

            <div class="info-card">

                <span>Technology</span>

                <strong>Java</strong>

            </div>


            <div class="info-card">

                <span>Application</span>

                <strong>Web App</strong>

            </div>


            <div class="info-card">

                <span>Environment</span>

                <strong>Development</strong>

            </div>


            <div class="info-card">

                <span>Status</span>

                <strong>Online</strong>

            </div>

        </div>


        <button onclick="showMessage()">

            🚀 click me

        </button>


        <p id="message"></p>


        <div class="footer">

            Java Web Application • DevOps Demo

        </div>


    </div>


    <script>

        function showMessage() {

            const message =
                document.getElementById("message");

            message.innerText =
                "✓ Hello! Button clicked successfully.";

            message.classList.remove("show");

            setTimeout(() => {

                message.classList.add("show");

            }, 50);

        }

    </script>


</body>

</html>
