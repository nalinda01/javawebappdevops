<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Java Web Application</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        h1 {
            font-size: 40px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-size: 20px;
        }

    </style>

</head>

<body>

    <h1>Java Web Application</h1>

    <button onclick="showMessage()">
        Click Me
    </button>

    <p id="message"></p>

    <script>

        function showMessage() {

            document.getElementById("message").innerText =
                "Hello! Button clicked.";

        }

    </script>

</body>

</html>
