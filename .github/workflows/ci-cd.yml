name: Java Docker CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: nalinda01/javawebapp

jobs:

  # ==========================================
  # CI - Test and Build
  # ==========================================

  test:
    name: Test Java Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven tests
        run: mvn clean test


  # ==========================================
  # CI - Docker Build and Push
  # ==========================================

  docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}


  # ==========================================
  # CD - Deploy to AWS EC2
  # ==========================================

  deploy:
    name: Deploy to AWS EC2
    needs: docker
    runs-on: ubuntu-latest

    steps:

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            echo "Starting deployment..."

            docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

            docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}

            docker stop javawebapp-container || true

            docker rm javawebapp-container || true

            docker run -d \
              --name javawebapp-container \
              --restart unless-stopped \
              -p 9099:9099 \
              ${{ env.IMAGE_NAME }}:${{ github.sha }}

            docker image prune -f

            echo "Deployment completed."

            docker ps